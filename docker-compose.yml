# Compose de DESARROLLO
# Uso: docker compose -f docker-compose.yml up -d --build
# Las rutas son relativas al directorio de este archivo.

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-net

  php-backend:
    build: ./backend
    container_name: php-backend
    depends_on:
      - mysql
    volumes:
      # Todo el backend compartido (incluye api/, images/, vendor/ y .env)
      - ./backend:/var/www/html
    networks:
      - app-net

  internal-api:
    build: ./internal
    container_name: internal-api
    # nodemon reinicia "npm start" cada vez que cambias un archivo
    command: sh -c "npm install && npx -y nodemon --legacy-watch --exec 'npm start'"
    ports:
      - "1234:1234"
    volumes:
      - ./internal:/app
      - /app/node_modules
    networks:
      - app-net

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      - PORT=80                   # nginx sigue apuntando a frontend:80
      - BROWSER=none
      - WATCHPACK_POLLING=true    # detectar cambios a través del bind mount
      - CHOKIDAR_USEPOLLING=true  # lo mismo para versiones viejas de CRA
      - WDS_SOCKET_PORT=0         # el hot reload usa el puerto del navegador (80)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-net

  reverse-proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - php-backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
